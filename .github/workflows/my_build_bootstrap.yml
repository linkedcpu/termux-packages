# 工作流名字，在 Actions 页面显示
name: 编译 bootstrap（含 Bergamot）

# 只在你手动点按钮时触发
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "选架构"
        default: "aarch64"
        type: choice
        options:
          - aarch64
          - arm
          - i686
          - x86_64

# 不给多余权限，安全
permissions: {}

jobs:
  build:
    # 用 Ubuntu 最新版（需要 Docker）
    runs-on: ubuntu-latest

    steps:
      # 第1步：拉取你的仓库代码
      # submodules: recursive → Bergamot 的 Marian 子模块一起拉
      - name: 拉代码
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # 第2步：从源码编译 bootstrap，把 bergamot 打进去
      - name: 编译 bootstrap
        run: |
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh \
            --architectures ${{ github.event.inputs.arch || 'aarch64' }} \
            --add bergamot-translator

      # 第3步：把编好的 zip 上传，方便下载
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-${{ github.event.inputs.arch || 'aarch64' }}
          path: "*.zip"
          retention-days: 30
